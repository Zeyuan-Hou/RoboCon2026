/quad/obstacle_nav_node:
  ros__parameters:
    # 障碍赛导航节点 TF 设置。
    # target_frame 是全局/雷达建图坐标系，child_frame 是机体雷达位姿坐标系。
    target_frame: "camera_init"
    child_frame: "aft_mapped"
    tf_topic: "/tf"

    # 导航执行后端：
    # - LOCAL_PD：旧版 TF 闭环 PD，直接发布 /quad/cmd_vel。
    # - NAV2：作为 Nav2 NavigateToPose action 上位节点，成功后仍发布 nav_status。
    # navigation_backend: "NAV2"
    ##TODO
    navigation_backend: "LOCAL_PD"

    nav2_action_name: "/navigate_to_pose"
    goal_frame_id: "map"
    nav2_action_server_wait_s: 0.1
    nav2_retry_period_s: 0.5

    # 导航目标来源模式：
    # - POINT_SEQUENCE：旧流程，直接按下面 target_points 固定点序列导航。
    # - TRAJECTORY_SEQUENCE：按 trajectory_files 中的轨迹文件序列导航。
    # - EXTERNAL_TARGET：由 task_manager_node 根据 obstacle_sequence.order 发布当前槽位 nav_target。
    #
    # 注意：
    # - obstacle_sequence.enabled=false 时，通常保持 POINT_SEQUENCE。
    # - obstacle_sequence.enabled=true 时，必须改成 EXTERNAL_TARGET，否则导航节点仍会按旧 target_points 自己走。
    ###todo
    # navigation_mode: "POINT_SEQUENCE"
    navigation_mode: "EXTERNAL_TARGET"

    # POINT_SEQUENCE 模式使用的固定导航点序列。
    # 格式为扁平数组：[x1, y1, yaw1, x2, y2, yaw2, ...]
    # 单位：x/y 为 m，yaw 为 rad，坐标系为雷达/建图坐标系。
    target_points: [
      # -0.725763, 0.951219, -0.043226
      # point1
      -0.17, 1.34, -0.006,
      # point2
      1.17, 2.54, 3.06
      # #point3
      # -2.26, 6.45, 3.129,
      # #point4
      # -3.716, 0.65, 1.467,
    ]

    # TRAJECTORY_SEQUENCE 模式使用的轨迹文件列表。
    # 每个文件包含一串雷达/建图坐标系下的绝对点：x y yaw。
    # trajectory_files:
    #   - "/absolute/path/to/obstacle_1_nav.txt"
    #   - "/absolute/path/to/obstacle_2_nav.txt"

    # 到点判定阈值。
    # position_tolerance 单位 m，yaw_tolerance 单位 rad。
    position_tolerance: 0.1
    yaw_tolerance: 0.10

    # 导航到目标点时的 PD/P 控制参数。
    # kp_* 越大响应越快但更容易震荡；kd_* 用于阻尼。
    kp_x: 1.7
    kp_y: 1.65
    kp_yaw: 1.45
    kd_x: 0.0001
    kd_y: 0.08
    kd_yaw: 0.05

    # 导航速度限幅。
    # max_vx/max_vy 单位 m/s，max_dyaw 单位 rad/s。
    max_vx: 0.65
    max_vy: 0.5
    max_dyaw: 0.75

    # LOCAL_PD 导航策略：
    # - 距目标点较远时，边用 linear.x/y 朝目标点移动，边让车头朝目标点方向。
    # - 距目标点小于 final_yaw_align_distance 后，开始对齐导航点配置的最终 yaw。
    # - 进入 position_tolerance 后若 yaw 未达标，则停止平移，只原地调最终 yaw。
    # - 任意阶段 active yaw 误差超过 yaw_only_threshold 时，只原地快速转 yaw。
    # - 长直线且车头基本对准目标点时，linear.x 使用 long_straight_max_vx 前进上限。

    # 距目标点小于该距离时，从“朝目标点方向”切换为“对齐 nav_target 最终 yaw”，单位 m。
    final_yaw_align_distance: 0.25
    # 远距离 approach 阶段的角速度上限，单位 rad/s；限制边走边转时的 yaw 速度。
    approach_yaw_max_dyaw: 0.55
    # active yaw 误差超过该阈值时，停止 linear.x/y，只原地快速转 yaw，单位 rad。
    # active yaw：远距离阶段用 err_approach_yaw，近点/到点阶段用最终 err_yaw。
    yaw_only_threshold: 1.2
    # yaw_only/近点最终 yaw 对齐阶段的原地转向峰值上限，单位 rad/s。
    yaw_only_max_dyaw: 0.95
    # yaw 误差小于该阈值后按比例降低原地转向限幅，避免接近目标时过冲，单位 rad。
    yaw_only_slowdown_threshold: 0.90
    # angular.z 每秒最大变化量，单位 rad/s^2；限制从 0 瞬间打满导致姿态异常。
    yaw_cmd_slew_rate: 1.2
    # 距目标点大于该距离时，才允许进入长直线加速逻辑，单位 m。
    long_straight_distance_threshold: 1.0
    # 朝目标点方向 yaw 误差小于该阈值时，认为车头基本对准，可以加速直行，单位 rad。
    long_straight_yaw_threshold: 0.15
    # 长直线加速时 linear.x 使用的前进 P 增益；只在 long_straight 阶段替代普通 kp_x。
    long_straight_kp_x: 2.2
    # 长直线加速时 linear.x 的前进速度上限，单位 m/s；只放大前进，不放大倒退。
    long_straight_max_vx: 0.75
    # 兼容旧配置保留；当前 LOCAL_PD 使用 yaw_only_threshold 做“先原地转 yaw”，不再看这个值。
    yaw_first_threshold: 0.25

    # 台阶后去高墙起点的小段专用控制：
    # 命中 enabled_slots 时不走通用点导航，而是先原地对齐 nav_target.yaw，再保持该 yaw 前进。
    yaw_then_forward:
      enabled_slots: ["wall"]
      align_yaw_tolerance: 0.08
      finish_yaw_tolerance: 0.07
      forward_tolerance: 0.10
      lateral_tolerance: 0.30
      kp_yaw: 1.20
      max_wz: 0.75
      wz_slew_rate: 1.0
      kp_forward: 1.2
      max_vx: 0.7
      kp_lateral: 1.2
      max_vy: 0.6

    # 导航控制频率，单位 Hz。
    control_rate: 50.0

/quad/task_bridge_cross_node:
  ros__parameters:
    # 旧/独立过桥节点参数。
    # 当前障碍赛主流程优先使用 /quad/task_executor_node.line_profiles。
    # 本段保留用于兼容旧节点或单独调试 task_bridge_cross_node。
    target_frame: "camera_init"
    child_frame: "aft_mapped"
    tf_topic: "/tf"

    # 旧过桥直线闭环参数。
    # target_dist 单位 m，max_speed 单位 m/s，yaw 单位 rad。
    straight_target_yaw: 0.0
    straight_target_dist: 4.0
    straight_max_speed: 0.5
    straight_kp_y: 2.0

    # 旧过桥 PID 和限幅参数。
    # max_vy 单位 m/s，max_dyaw 单位 rad/s。
    kp_xy: 0.5
    kp_yaw: 1.0
    max_vy: 0.5
    max_dyaw: 0.5

    # 旧过桥节点控制频率，单位 Hz。
    control_rate: 50.0
