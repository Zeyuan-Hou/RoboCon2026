      
/quad/task_manager_node:
  ros__parameters:
    # 视觉对准偏移 
    #【左右偏置，前后偏置，yaw偏置】参考相机系的话[向左为正，向前为正，左转为正]
    # 即为二维码在相机正前方700mm处
    default_offset: [0.0, 700.0, 0.0]
    # --- 特定任务 ID 配置 ---
    # 格式: [target_dist_x, target_dist_y, target_yaw]
    # 程序会自动加载 tasks.task_3, tasks.task_4, tasks.task_5
    tasks: 
    # TODO
      # 任务 1：矮杆
      # 准备位置设定为 700mm
      task_1: [0.0, 800.0, 0.0]
      crawl_move_duration_: 3.5
      crawl_speed_x: 0.5
      crawl_speed_y: 0.0
      crawl_speed_yaw: 0.0
      # 任务 2：位控
      # 可能需要离墙稍远一点点（如 800mm）以保证跳跃空间
      task_2: [0.0, 700.0, 0.0]
    
    # 动作时间配置 (在此处修改即可生效，无需重新编译)

    policy_timers:
      prep: 1.5
      action: 1.0
      buffer: 1.0
      recover: 1.5

    # 复杂动作的时间参数 (execute_complex_task - 如跳跃)
    task_timers:
      prep: 2.0
      action: 3.5
      buffer: 1.5
      recover: 2.0

